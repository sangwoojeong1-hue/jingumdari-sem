<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>징검다리 셈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   색·크기 — 바꾸고 싶으면 여기만 고치면 됩니다
   ========================================================= */
:root{
  --bg:#eaf6fc;        /* 바탕(하늘) */
  --water:#bfe3f4;     /* 냇물 */
  --water2:#9fd2ec;
  --stone:#cdbfac;     /* 돌 */
  --stone-d:#9c8b74;
  --ink:#27323d;       /* 글자 */
  --sub:#62707e;
  --card:#ffffff;
  --accent:#f08a24;    /* 포인트(주황) */
  --stamp:#d9442b;     /* 합격 도장 */
  --ok:#239a62;
  --bad:#d9533c;
  --shade:#f5a03a;     /* 그림 색칠 1 */
  --shade2:#3fa79a;    /* 그림 색칠 2 */
  --line:#4a5662;
  --lock:#dcd8d1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
.hidden{display:none!important}
.jua{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400}

/* 화면 전환 */
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* 위쪽 막대 */
.bar{
  display:flex;align-items:center;gap:12px;
  height:68px;padding:0 20px;flex:0 0 auto;
}
.bar .grow{flex:1}
.title{font-family:"Jua",sans-serif;font-size:30px;letter-spacing:1px}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px;
  background:#fff;border-radius:22px;font-size:19px;font-weight:700;box-shadow:0 2px 0 #cfe2ec;
}
.iconbtn{
  width:48px;height:48px;border-radius:24px;background:#fff;font-size:24px;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #cfe2ec;
}
.backbtn{
  height:46px;padding:0 18px;border-radius:23px;background:#fff;font-size:18px;font-weight:700;
  box-shadow:0 2px 0 #cfe2ec;
}

/* ---------- 분수 표시 ---------- */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1}
.frac>.num,.frac>.den{display:block;padding:.06em .18em;text-align:center;min-width:1em}
.frac>.num{border-bottom:.08em solid currentColor}
.neg{margin-right:.04em}

/* =========================================================
   1. 징검다리 지도
   ========================================================= */
#map .river{
  flex:1;display:flex;flex-direction:column;gap:18px;
  padding:6px 28px 14px;overflow-y:auto;min-height:0;
}
.lane:first-child{margin-top:auto} .lane:last-child{margin-bottom:auto}  /* 화면이 넉넉하면 가운데, 좁으면 스크롤 */
.lane{position:relative}
.lane h3{margin:0 0 8px 6px;font-family:"Jua",sans-serif;font-weight:400;font-size:22px;color:var(--sub)}
.stream{
  position:relative;border-radius:30px;padding:72px 18px 12px;
  background:
    repeating-linear-gradient(100deg,transparent 0 38px,rgba(255,255,255,.35) 38px 41px,transparent 41px 80px),
    linear-gradient(180deg,var(--water),var(--water2));
  display:flex;justify-content:space-around;align-items:flex-start;
}
.stream::before{ /* 돌 사이 점선 길 */
  content:"";position:absolute;left:8%;right:8%;top:116px;border-top:4px dashed rgba(255,255,255,.85);
}
.stone{position:relative;display:flex;flex-direction:column;align-items:center;width:120px;z-index:1}
.stone .rock{
  width:96px;height:88px;border-radius:50% 50% 46% 54%/56% 52% 48% 44%;
  background:var(--stone);box-shadow:inset 0 -8px 0 var(--stone-d),0 4px 0 rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:center;
  font-family:"Jua",sans-serif;font-size:38px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);
  transition:transform .15s;
}
.stone:active .rock{transform:scale(.94)}
.stone .lbl{margin-top:8px;font-size:15px;font-weight:700;text-align:center;line-height:1.25;color:var(--ink);word-break:keep-all;min-height:38px}
.stone.locked .rock{background:var(--lock);box-shadow:inset 0 -8px 0 #c3bdb3;color:#a8a29a}
.stone.locked .lbl{color:#7f8b96}
.stone.current .rock{outline:5px solid #fff;outline-offset:3px;animation:pulse 1.6s infinite}
.stone .badge{position:absolute;top:-6px;right:6px;font-size:24px}
.stone .seal{
  position:absolute;top:-10px;right:-2px;width:50px;height:50px;border-radius:50%;
  border:3px solid var(--stamp);color:var(--stamp);background:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;font-family:"Jua",sans-serif;font-size:16px;
  transform:rotate(-14deg);
}
.stone.stamp .seal{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:scale(2.6) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-14deg);opacity:1}}
@keyframes pulse{0%,100%{outline-color:#fff}50%{outline-color:#ffd38f}}
.mapfoot{text-align:center;padding:0 0 18px;font-size:20px;font-weight:700;color:var(--sub)}
.mapfoot b{color:var(--stamp);font-size:26px}
.mapfoot b.star{color:#e0a100}

/* =========================================================
   2. 단원 입구 (원리 보기)
   ========================================================= */
#entry .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 24px 22px;min-height:0}
.card{
  width:min(860px,100%);flex:1;max-height:440px;min-height:0;background:var(--card);border-radius:26px;
  box-shadow:0 4px 0 #cfe2ec;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:18px 28px;gap:16px;text-align:center;overflow-y:auto;
}
.card>*{flex-shrink:0}
.card .cpic{margin-top:auto} .card .ctext{margin-bottom:auto}  /* 내용이 짧으면 가운데, 길면 위에서부터 스크롤 */
.card .cpic{display:flex;align-items:center;justify-content:center;max-width:100%}
.card .ctext{font-size:23px;line-height:1.75;word-break:keep-all}
.card .ctext small{font-size:18px;color:var(--sub)}
.cardnav{display:flex;align-items:center;gap:18px}
.cardnav .arrow{width:56px;height:56px;border-radius:28px;background:#fff;font-size:24px;box-shadow:0 2px 0 #cfe2ec}
.cardnav .arrow:disabled{opacity:.35}
.dots{display:flex;gap:10px}
.dots i{width:13px;height:13px;border-radius:50%;background:#c4d7e2;display:block}
.dots i.on{background:var(--accent)}
.modebtns{display:flex;gap:20px}
.bigbtn{
  height:72px;min-width:230px;padding:0 30px;border-radius:36px;font-size:25px;font-family:"Jua",sans-serif;
  background:#fff;box-shadow:0 5px 0 #cfe2ec;
}
.bigbtn.primary{background:var(--accent);color:#fff;box-shadow:0 5px 0 #c96c12}
.bigbtn.green{background:var(--ok);color:#fff;box-shadow:0 5px 0 #1a744a}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #cfe2ec}
.linkbtn{font-size:18px;font-weight:700;color:var(--stamp);padding:6px 10px}

/* 그림 묶음 */
.stack{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.stack .row{display:flex;align-items:center;gap:14px}
.stack .rl{min-width:56px;text-align:right;font-size:24px;font-weight:700}
.eqrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.eqrow .op{font-size:34px;font-weight:700}
.bigf{font-size:34px;font-weight:700;line-height:2}
.signtbl{border-collapse:collapse;font-size:26px;font-weight:700}
.signtbl td{border:2px solid #d6e3ea;padding:6px 18px}
.signtbl .p{color:var(--ok)} .signtbl .m{color:var(--bad)}

/* =========================================================
   3. 문제 풀이
   ========================================================= */
.progress{height:10px;margin:0 20px;background:#d6e9f3;border-radius:5px;overflow:hidden;flex:0 0 auto}
.progress>div{height:100%;width:0;background:var(--accent);border-radius:5px;transition:width .3s}
.playgrid{flex:1;display:grid;grid-template-columns:1fr 330px;gap:18px;padding:14px 20px 20px;min-height:0}
.qarea{
  background:#fff;border-radius:26px;box-shadow:0 4px 0 #cfe2ec;
  display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 24px;
  overflow-y:auto;min-height:0;position:relative;
}
.qarea>*{flex-shrink:0}
.qarea{padding-bottom:0}
.ask{font-size:22px;font-weight:700;text-align:center;line-height:1.6;word-break:keep-all}
.pic{display:flex;justify-content:center;align-items:center;max-width:100%}
.pic svg{max-width:100%;height:auto}
.expr{font-size:44px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;min-height:20px}
.expr .frac{font-size:.92em}
/* 답 칸 */
.ans{display:inline-flex;align-items:center;gap:4px;margin-left:6px}
.asign{min-width:.5em;text-align:right;color:var(--accent)}
.abox{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:78px;height:62px;padding:0 8px;border:3px solid #b9c9d3;border-radius:14px;background:#f7fbfd;
  font-size:40px;color:var(--accent);
}
.abox.on{border-color:var(--accent);background:#fff6ec;box-shadow:0 0 0 4px rgba(240,138,36,.18)}
.afrac{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.afrac .aline{width:100%;height:5px;background:var(--ink);border-radius:3px}
.cbox{
  display:inline-flex;align-items:center;justify-content:center;width:70px;height:62px;
  border:3px dashed #b9c9d3;border-radius:14px;color:var(--accent);margin:0 6px;
}
.filled{color:var(--ok)}
.choices{display:flex;gap:16px;justify-content:center}
.choices button{
  width:96px;height:80px;border-radius:20px;background:#f2f7fa;font-size:40px;font-weight:900;
  box-shadow:0 4px 0 #d4e1e8;
}
.choices button.sel{background:var(--accent);color:#fff;box-shadow:0 4px 0 #c96c12}
.feedback{min-height:34px;font-size:24px;font-weight:900;text-align:center}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)} .feedback.info{color:var(--accent)}
.helpbox{
  width:100%;background:#fff8ef;border:2px solid #fbd7ad;border-radius:18px;padding:14px 18px;
  font-size:24px;line-height:1.8;text-align:center;word-break:keep-all;
}
.helpbox .frac{font-size:1.05em}
.helpbox>*{flex-shrink:0}
.helpbox h4{margin:0 0 6px;font-family:"Jua",sans-serif;font-weight:400;font-size:22px;color:var(--accent)}
.helpbox .pic{margin:8px 0}
.hintbtn{
  flex:0 0 auto;height:50px;padding:0 20px;border-radius:25px;margin-bottom:24px;
  background:#fff4e2;color:#b5650f;font-size:18px;font-weight:700;
}
.qspacer{display:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* 숫자패드 */
.padarea{display:flex;flex-direction:column;gap:12px;min-height:0}
.fracsel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fracsel button{height:52px;border-radius:16px;background:#fff;font-size:17px;font-weight:700;box-shadow:0 3px 0 #cfe2ec}
.fracsel button.on{background:#fff1e1;color:#b5650f;box-shadow:0 3px 0 #f2c48f}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-height:0}
.pad button{
  border-radius:18px;background:#fff;font-size:34px;font-weight:700;box-shadow:0 4px 0 #cfe2ec;min-height:56px;
}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #cfe2ec}
.pad button.minus{color:var(--accent)}
.pad.dim{opacity:.3;pointer-events:none}
.check{
  height:76px;border-radius:22px;background:var(--accent);color:#fff;font-family:"Jua",sans-serif;font-size:30px;
  box-shadow:0 5px 0 #c96c12;flex:0 0 auto;
}
.check:active{transform:translateY(3px);box-shadow:0 2px 0 #c96c12}
.check.next{background:var(--ok);box-shadow:0 5px 0 #1a744a}

/* 그림 클릭 */
.pc,.nlhit{cursor:pointer}

/* =========================================================
   4. 결과 / 합격증
   ========================================================= */
#result .body{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 20px;overflow-y:auto;min-height:0}
#result .body>:first-child{margin-top:auto} #result .body>:last-child{margin-bottom:auto}
.restitle{font-family:"Jua",sans-serif;font-size:44px;margin:0}
.resmsg{font-size:22px;font-weight:700;color:var(--sub);text-align:center}
.cert{
  position:relative;width:440px;max-width:100%;padding:26px 30px 24px;background:#fffdf6;
  border:6px double #c9a76a;border-radius:10px;text-align:center;box-shadow:0 6px 0 #e6dcc6;
}
.cert .ct{font-family:"Jua",sans-serif;font-size:40px;letter-spacing:14px;margin-bottom:12px}
.cert .cn{font-size:30px;font-weight:900;margin:6px 0}
.cert .cu{font-size:21px;font-weight:700}
.cert .cd{font-size:18px;color:var(--sub);margin-top:10px}
.cert .cchar{position:absolute;left:12px;top:8px;width:92px;height:92px;font-size:62px}
.cert .cseal{
  position:absolute;right:22px;top:22px;width:78px;height:78px;border-radius:50%;
  border:4px solid var(--stamp);color:var(--stamp);display:flex;align-items:center;justify-content:center;
  font-family:"Jua",sans-serif;font-size:20px;line-height:1.05;text-align:center;transform:rotate(-14deg);background:rgba(255,255,255,.6);
  animation:stamp .6s .25s cubic-bezier(.2,1.6,.4,1) both;
}
.resbtns{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}

/* =========================================================
   창(모달)
   ========================================================= */
.modal{position:fixed;inset:0;background:rgba(30,45,60,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.mbox{
  background:#fff;border-radius:26px;padding:26px 30px;width:min(560px,100%);max-height:92vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:16px;align-items:stretch;
}
.mbox.wide{width:min(880px,100%)}
.mbox h2{margin:0;font-family:"Jua",sans-serif;font-weight:400;font-size:30px;text-align:center}
.mbox p{margin:0;font-size:20px;text-align:center;line-height:1.6;word-break:keep-all}
.mbox input[type=text],.mbox input[type=password]{
  height:62px;border:3px solid #b9c9d3;border-radius:16px;padding:0 18px;font-size:26px;font-family:inherit;
  -webkit-user-select:text;user-select:text;outline:none;
}
.mbox input:focus{border-color:var(--accent)}
.mrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.mbtn{height:58px;min-width:140px;padding:0 24px;border-radius:29px;font-size:21px;font-weight:700;background:#eef4f7}
.mbtn.primary{background:var(--accent);color:#fff}
.mbtn.danger{background:#fde8e4;color:var(--bad)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tgrid label,.tline{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#f3f8fb;font-size:17px;font-weight:700;
}
.tgrid input,.tline input{width:24px;height:24px;accent-color:var(--accent)}
.sect{font-size:17px;font-weight:900;color:var(--sub);margin-top:4px}
.rev{border:2px solid #e3edf2;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.rev .rq{font-size:30px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:4px}
.rev .ra{font-size:19px;color:var(--sub)}
.rev .ra b{color:var(--bad)}
.rev .rx{font-size:18px;line-height:1.7;text-align:center;word-break:keep-all;background:#fff8ef;border-radius:12px;padding:8px 12px;width:100%}


/* =========================================================
   캐릭터 — 그림이 없으면 이모지로 대신 보여 줌
   ========================================================= */
.ch{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;line-height:1;pointer-events:none}
.mapchar{position:absolute;top:-72px;left:calc(50% - 46px);width:92px;height:92px;font-size:58px;z-index:3;pointer-events:none}
.mapchar .inner{width:100%;height:100%;transform-origin:50% 100%;animation:breathe 2.4s ease-in-out infinite}
.goal{position:relative;display:flex;flex-direction:column;align-items:center;width:120px;z-index:1}
.goal .flag{width:96px;height:88px;display:flex;align-items:center;justify-content:center;font-size:54px}
.goal .lbl{margin-top:8px;font-size:15px;font-weight:700;color:var(--ink);min-height:38px}
.stars{height:20px;font-size:17px;letter-spacing:1px;color:#d9d1c4;line-height:20px}
.stars .on{color:#f2b100}
.chip{cursor:pointer}
.chipchar{width:42px;height:42px;font-size:27px;display:inline-block}

/* 문제 화면의 친구 + 말풍선 (아래에 붙어 있음) */
.buddyrow{
  position:sticky;bottom:0;align-self:stretch;margin-top:auto;z-index:2;
  display:flex;align-items:flex-end;gap:12px;padding:10px 0 0;background:#fff;
}
.buddy{width:120px;height:120px;flex:0 0 120px;margin-left:-8px;font-size:78px;transform-origin:50% 100%}
.bubble{
  position:relative;flex:1;min-height:58px;margin-bottom:24px;padding:10px 18px;
  display:flex;align-items:center;background:#f4f9fc;border:2px solid #d6e6ef;border-radius:18px;
  font-size:20px;font-weight:900;line-height:1.45;word-break:keep-all;
}
.bubble::before{content:"";position:absolute;left:-12px;bottom:16px;border:10px solid transparent;border-right-color:#d6e6ef;border-left:0}
.bubble::after{content:"";position:absolute;left:-8px;bottom:18px;border:8px solid transparent;border-right-color:#f4f9fc;border-left:0}
.bubble.ok{color:var(--ok)} .bubble.bad{color:var(--bad)} .bubble.info{color:#b5650f}

/* 표정마다 움직임 */
.anim-idle{animation:breathe 2.4s ease-in-out infinite}
.anim-happy,.anim-jump{animation:hop .7s ease-out}
.anim-cheer{animation:hop .9s ease-out infinite}
.anim-oops{animation:tilt .8s ease-in-out}
.anim-talk{animation:bob .6s ease-in-out 2}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04,.97)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-24px)}55%{transform:translateY(0)}75%{transform:translateY(-8px)}}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}55%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 시험 진행: 작은 징검다리 10개 */
.track{position:relative;height:70px;margin:0 20px;padding:0 8px 6px;display:flex;align-items:flex-end;justify-content:space-between;flex:0 0 auto}
.track .st{width:calc((100% - 16px) / 10 - 14px);height:16px;border-radius:50%;background:var(--lock);box-shadow:inset 0 -4px 0 #c3bdb3}
.track .st.done{background:var(--stone);box-shadow:inset 0 -4px 0 var(--stone-d)}
.track .mini{position:absolute;bottom:10px;left:0;width:58px;height:58px;font-size:36px;transition:left .45s ease}

/* 결과 */
.resbuddy{width:156px;height:156px;font-size:104px;transform-origin:50% 100%;flex:0 0 auto}
.reststars{font-size:48px;letter-spacing:8px;color:#d9d1c4;line-height:56px;height:56px}
.reststars span{display:inline-block}
.reststars .on{color:#f2b100;animation:pop .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}

/* 캐릭터 고르기 */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 14px;border-radius:22px;background:#f3f8fb;border:3px solid transparent}

}

  body{overflow:auto}

<script>
/* =========================================================
   ★ 설정 — 선생님이 직접 바꿀 수 있는 값은 여기에 모았습니다
   ========================================================= */
const CONFIG = {
  EXAM_COUNT: 10,        // 시험 문항 수
  PASS_SCORE: 7,         // 이 개수 이상 맞히면 합격
  MAX_DEN: 12,           // 분수 문제 분모(통분 후 포함)의 최댓값
  INT_RANGE: 20,         // 정수 문제 숫자 범위 (−20 ~ 20)
  REDUCE_RETRY: true,    // 약분 안 한 답에 "한 번 더 약분" 기회 주기
  STAR_2: 9,             // 이 개수 이상이면 별 2개 (합격은 별 1개)
  STAR_3: 10,            // 이 개수 이상이면 별 3개
  TEACHER_PW: '1234',    // 교사용 메뉴 비밀번호 ← 꼭 바꿔 주세요
  CHEERS: ['정답! 👏', '잘했어요! 🎉', '최고예요! ⭐', '바로 그거야! 👍', '척척 박사! 💯'],
  RETRY_MSG: '아쉬워요! 힌트를 보고 한 번 더 해 볼까요?',
  REDUCE_MSG: '거의 다 왔어요! 한 번 더 약분할 수 있어요 ✂️',
  FAIL_MSG: (need, got) => `${need}개만 맞히면 합격! 지금 ${got}개 — 조금만 더 연습해요 💪`,
};
const STORE_KEY = 'jingumdari-sem-v1';

/* =========================================================
   ★ 캐릭터 — 이름·설명은 여기서 바꿀 수 있어요.
   그림(PNG)은 파일 맨 아래 CHAR_IMAGES 에 들어갑니다. 그림이 없으면 emoji 로 대신 보여 줘요.
   표정: idle 기본, happy 기쁨, oops 아쉬움, jump 점프, talk 설명, cheer 축하
   ========================================================= */
const CHARACTERS = [
  { id: 'rabbit', name: '깡총이', kind: '토끼',   emoji: '🐰' },
  { id: 'bear',   name: '뭉치',   kind: '아기곰', emoji: '🐻' },
  { id: 'cat',    name: '냥냥이', kind: '고양이', emoji: '🐱' },
  { id: 'frog',   name: '퐁당이', kind: '개구리', emoji: '🐸' },
];
const POSE_FALLBACK = { jump: 'happy', cheer: 'happy', talk: 'idle', happy: 'idle', oops: 'idle' }; // 그림이 없는 표정은 이걸로 대신   // 기기에 저장되는 이름 (바꾸면 기록이 초기화된 것처럼 보임)

/* =========================================================
   기본 도구: 난수, 분수 계산
   ========================================================= */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sgn = () => (Math.random() < .5 ? 1 : -1);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }
const lcm = (a, b) => a / gcd(a, b) * b;
const nz = (a, b) => { let x; do { x = ri(a, b); } while (x === 0); return x; };          // 0이 아닌 정수
const coprimeNum = d => { let a; do { a = ri(1, d - 1); } while (gcd(a, d) !== 1); return a; }; // 기약 진분수의 분자

// 분수: 분모는 항상 양수, 부호는 분자에
class Fr {
  constructor(n, d = 1) { if (d < 0) { n = -n; d = -d; } this.n = n; this.d = d; }
  red() { const g = gcd(this.n, this.d); return new Fr(this.n / g, this.d / g); }
  add(o) { return new Fr(this.n * o.d + o.n * this.d, this.d * o.d).red(); }
  sub(o) { return new Fr(this.n * o.d - o.n * this.d, this.d * o.d).red(); }
  mul(o) { return new Fr(this.n * o.n, this.d * o.d).red(); }
  div(o) { return new Fr(this.n * o.d, this.d * o.n).red(); }
  eq(o) { return this.n * o.d === o.n * this.d; }
  cmp(o) { return Math.sign(this.n * o.d - o.n * this.d); }
  abs() { return new Fr(Math.abs(this.n), this.d); }
}

/* ---------- 수를 화면용 HTML로 ---------- */
const M = '−'; // 진짜 빼기 기호
const N = x => (x < 0 ? M + (-x) : '' + x);                              // 정수: −3
const S = x => '(' + (x < 0 ? M : '+') + Math.abs(x) + ')';              // 부호 붙인 정수: (+3) (−3)
const F = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
function V(f) {                                                           // 분수(또는 정수) 값 하나
  if (f.d === 1) return N(f.n);
  return (f.n < 0 ? `<span class="neg">${M}</span>` : '') + F(Math.abs(f.n), f.d);
}
const SV = f => '(' + (f.n < 0 ? M : '+') + V(f.abs()) + ')';            // (−3/4) 꼴
function VR(n, d) {                                                       // 결과 + 약분되면 "= 약분 결과"
  const raw = new Fr(n, d), r = raw.red();
  return (r.n === raw.n && r.d === raw.d) ? V(raw) : V(raw) + ' = ' + V(r);
}

/* =========================================================
   그림(SVG) 만들기
   ========================================================= */
const C = { s1: 'var(--shade)', s2: 'var(--shade2)', line: 'var(--line)', both: '#e2701a', c1: '#fde0b8', c2: '#c9ebe5' };

// 원(피자) n조각, 앞에서부터 k조각 색칠 (o.set 이 있으면 그 조각들을 색칠)
function pie(n, k, o = {}) {
  const size = o.size || 150, r = size / 2 - 5, c = size / 2, color = o.color || C.s1;
  const on = i => (o.set ? o.set.has(i) : (o.only != null ? i === o.only : i < k));
  let s = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`;
  if (n === 1) {
    s += `<circle cx="${c}" cy="${c}" r="${r}" fill="${on(0) ? color : '#fff'}" stroke="${C.line}" stroke-width="3" class="${o.click ? 'pc' : ''}" data-i="0"/>`;
  } else {
    for (let i = 0; i < n; i++) {
      const a0 = (-90 + 360 * i / n) * Math.PI / 180, a1 = (-90 + 360 * (i + 1) / n) * Math.PI / 180;
      const x0 = c + r * Math.cos(a0), y0 = c + r * Math.sin(a0), x1 = c + r * Math.cos(a1), y1 = c + r * Math.sin(a1);
      s += `<path d="M${c} ${c} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${360 / n > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z"
        fill="${on(i) ? color : '#fff'}" stroke="${C.line}" stroke-width="3" stroke-linejoin="round" class="${o.click ? 'pc' : ''}" data-i="${i}"/>`;
    }
  }
  return s + '</svg>';
}

// 띠(막대) n칸, 앞에서부터 k칸 색칠
function bar(n, k, o = {}) {
  const w = o.w || 300, h = o.h || 48, cw = (w - 6) / n, color = o.color || C.s1;
  const on = i => (o.set ? o.set.has(i) : i < k);
  let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
  for (let i = 0; i < n; i++) {
    s += `<rect x="${(3 + i * cw).toFixed(2)}" y="3" width="${cw.toFixed(2)}" height="${h - 6}" fill="${on(i) ? color : '#fff'}"
      stroke="${C.line}" stroke-width="3" class="${o.click ? 'pc' : ''}" data-i="${i}"/>`;
  }
  return s + '</svg>';
}

// 넓이 격자: 세로로 b칸 중 a칸, 가로로 d칸 중 c칸 (겹친 곳 진하게)
function grid(b, a, d, c, o = {}) {
  const size = o.size || 200, cw = (size - 6) / b, ch = (size - 6) / d;
  let s = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`;
  for (let i = 0; i < b; i++) for (let j = 0; j < d; j++) {
    const inC = i < a, inR = j < c;
    const fill = inC && inR ? C.both : inC ? C.c1 : inR ? C.c2 : '#fff';
    s += `<rect x="${(3 + i * cw).toFixed(2)}" y="${(3 + j * ch).toFixed(2)}" width="${cw.toFixed(2)}" height="${ch.toFixed(2)}" fill="${fill}" stroke="${C.line}" stroke-width="2"/>`;
  }
  s += `<rect x="3" y="3" width="${size - 6}" height="${size - 6}" fill="none" stroke="${C.line}" stroke-width="4"/>`;
  return s + '</svg>';
}

// 수직선: min~max, 점(points), 화살표(arrows), 터치해서 점 찍기(click)
function numLine(o) {
  const min = o.min, max = o.max, w = o.w || 660, pad = 34;
  const nArr = (o.arrows || []).length;
  const h = 78 + nArr * 26, y = h - 40;
  const step = (w - 2 * pad) / (max - min), X = v => pad + (v - min) * step;
  const labelOn = v => o.labels === 'all' || (Array.isArray(o.labels) ? o.labels.includes(v) : v === 0);
  let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="overflow:visible">`;
  s += `<line x1="${pad - 22}" y1="${y}" x2="${w - pad + 22}" y2="${y}" stroke="${C.line}" stroke-width="3"/>`;
  s += `<path d="M${w - pad + 26} ${y} l-12 -7 v14 z M${pad - 26} ${y} l12 -7 v14 z" fill="${C.line}"/>`;
  for (let v = min; v <= max; v++) {
    const t = v === 0 ? 13 : 8;
    s += `<line x1="${X(v)}" y1="${y - t}" x2="${X(v)}" y2="${y + t}" stroke="${C.line}" stroke-width="${v === 0 ? 4 : 2.5}"/>`;
    if (labelOn(v)) s += `<text x="${X(v)}" y="${y + 34}" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">${N(v)}</text>`;
  }
  (o.arrows || []).forEach((a, i) => {
    const ay = y - 26 - i * 26, x1 = X(a.from), x2 = X(a.to), dir = Math.sign(x2 - x1) || 1, col = a.color || (i % 2 ? C.s2 : C.s1);
    s += `<line x1="${x1}" y1="${y}" x2="${x1}" y2="${ay}" stroke="${col}" stroke-width="2" stroke-dasharray="3 4"/>`;
    s += `<line x1="${x1}" y1="${ay}" x2="${x2 - dir * 10}" y2="${ay}" stroke="${col}" stroke-width="5" stroke-linecap="round"/>`;
    s += `<path d="M${x2} ${ay} l${-dir * 14} -9 v18 z" fill="${col}"/>`;
    if (a.text) s += `<text x="${(x1 + x2) / 2}" y="${ay - 8}" text-anchor="middle" font-size="16" font-weight="700" fill="${col}">${a.text}</text>`;
  });
  (o.points || []).forEach(v => {
    s += `<circle cx="${X(v)}" cy="${y}" r="10" fill="var(--accent)" stroke="#fff" stroke-width="3"/>`;
  });
  if (o.click) {
    if (o.sel != null) s += `<circle cx="${X(o.sel)}" cy="${y}" r="12" fill="var(--accent)" stroke="#fff" stroke-width="3"/>`;
    for (let v = min; v <= max; v++) s += `<rect class="nlhit" data-v="${v}" x="${X(v) - step / 2}" y="0" width="${step}" height="${h}" fill="transparent"/>`;
  }
  return s + '</svg>';
}

// 바둑돌: + 돌 p개, − 돌 m개, 짝 지은 것은 흐리게
function chips(p, m) {
  const r = 22, gap = 56, cols = Math.max(p, m), w = cols * gap + 20, h = 150, pairs = Math.min(p, m);
  let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
  for (let i = 0; i < cols; i++) {
    const x = 32 + i * gap, paired = i < pairs;
    if (paired) s += `<line x1="${x}" y1="38" x2="${x}" y2="112" stroke="#9aa6b1" stroke-width="3" stroke-dasharray="5 5"/>`;
    if (i < p) s += `<g opacity="${paired ? .35 : 1}"><circle cx="${x}" cy="36" r="${r}" fill="${C.s1}" stroke="${C.line}" stroke-width="2.5"/><text x="${x}" y="45" text-anchor="middle" font-size="28" font-weight="900" fill="#fff">+</text></g>`;
    if (i < m) s += `<g opacity="${paired ? .35 : 1}"><circle cx="${x}" cy="114" r="${r}" fill="${C.s2}" stroke="${C.line}" stroke-width="2.5"/><text x="${x}" y="123" text-anchor="middle" font-size="30" font-weight="900" fill="#fff">${M}</text></g>`;
  }
  return s + '</svg>';
}

// 그림 여러 개를 이름표와 함께 세로로 쌓기
const stack = rows => `<div class="stack">${rows.map(([l, svg]) => `<div class="row"><span class="rl">${l}</span>${svg}</div>`).join('')}</div>`;
const eqrow = parts => `<div class="eqrow">${parts.map(p => (p.length <= 2 ? `<span class="op">${p}</span>` : p)).join('')}</div>`;

/* =========================================================
   단원 정보 — 원리 카드와 문제 틀
   문제 하나 = { ask: 안내문, q: 식({ANS}=답칸, {CH}=기호칸), pic: 그림,
                kind: 'frac'|'int'|'choice'|'shade'|'numline', ans: 정답,
                choices, hint: 힌트, ex: 그림 풀이, noRed: 약분 검사 안 함 }
   ========================================================= */
const A = '{ANS}', CH = '{CH}';

// 분모 짝 고르기 (공배수가 MAX_DEN 이하인 것만)
function denPair() {
  const opts = [];
  for (let a = 2; a <= 6; a++) for (let b = a + 1; b <= CONFIG.MAX_DEN; b++) if (lcm(a, b) <= CONFIG.MAX_DEN) opts.push([a, b]);
  return shuffle(pick(opts));
}
const cmpSym = c => (c > 0 ? '>' : c < 0 ? '<' : '=');

const UNITS = [
/* ---------------- ① 분수의 뜻과 크기 비교 ---------------- */
{
  title: '분수의 뜻과 크기 비교', short: '분수의 뜻',
  cards: () => [
    { pic: pie(4, 3, { size: 170 }), text: `피자를 <b>똑같이 4조각</b>으로 나눠 <b>3조각</b>을 색칠하면 ${F(3, 4)}<br><small>분모 = 똑같이 나눈 조각 수, 분자 = 색칠한 조각 수</small>` },
    { pic: stack([[F(3, 8), bar(8, 3)], [F(5, 8), bar(8, 5)]]), text: `분모가 같으면 한 조각의 크기가 같아요.<br>조각이 더 많은 쪽이 커요 → ${F(5, 8)} &gt; ${F(3, 8)}` },
    { pic: stack([[F(1, 2), bar(2, 1)], [F(1, 3), bar(3, 1)], [F(1, 4), bar(4, 1)]]), text: `분자가 1이면, <b>많이 나눌수록</b> 한 조각이 작아져요.<br>${F(1, 2)} &gt; ${F(1, 3)} &gt; ${F(1, 4)}` },
  ],
  types: [
    () => { // 그림 보고 분수 쓰기
      const n = ri(2, 8), k = ri(1, n - 1), shape = pick(['pie', 'bar']);
      const pic = shape === 'pie' ? pie(n, k) : bar(n, k);
      return { ask: '색칠한 부분을 분수로 나타내 보세요.', pic, q: `색칠한 부분 = ${A}`, kind: 'frac', ans: new Fr(k, n), noRed: true,
        hint: `전체를 몇 조각으로 나눴나요? 그게 <b>분모</b>(아래 칸)예요. 색칠한 조각 수가 <b>분자</b>(위 칸)예요.`,

  ],

      const b = ri(2, 5), a = coprimeNum(b), m = ri(2, 3);
      const pic = stack([[F(a, b), bar(b, a, { w: 280 })], ['', bar(b * m, a * m, { w: 280 })]]);
      return { ask: '그림을 보고 빈칸에 알맞은 수를 쓰세요.', pic, q: `${F(a, b)} = <span class="frac"><span class="num">${A}</span><span class="den">${b * m}</span></span>`,
        kind: 'int', ans: a * m,
        hint: `분모가 ${b}에서 ${b * m}로 <b>${m}배</b>가 됐어요. 분자도 ${m}배 해요!`,
        ex: `${pic}<br>${F(a, b)} = ${F(`${a}×${m}`, `${b}×${m}`)} = ${F(a * m, b * m)}` };
    },
    () => { // 기약분수로 약분
      const b = ri(2, 7), a = coprimeNum(b), m = ri(2, 4);
      return { ask: '기약분수로 나타내세요.', q: `${F(a * m, b * m)} = ${A}`, kind: 'frac', ans: new Fr(a, b),
        hint: `${a * m}과 ${b * m}을 <b>모두 나눌 수 있는 수</b>를 찾아 나눠요. 더 나눌 수 없을 때까지!`,
        ex: `${F(a * m, b * m)} → 분모·분자를 ${m}로 나누기 → ${F(a, b)}` };

      const [d1, d2] = denPair(), n1 = coprimeNum(d1), n2 = coprimeNum(d2), L = lcm(d1, d2);
      const mult = d => Array.from({ length: Math.ceil(L / d) + 1 }, (_, i) => d * (i + 1)).map(v => (v === L ? `<b>${v}</b>` : v)).join(', ');
      return { ask: '두 분수를 통분하려고 해요. 가장 작은 공통분모는?', q: `${F(n1, d1)}, ${F(n2, d2)} → 공통분모 ${A}`, kind: 'int', ans: L,
        hint: `${d1}의 배수와 ${d2}의 배수를 차례로 써 보고, 처음으로 같은 수를 찾아요.`,
        ex: `${d1}의 배수: ${mult(d1)} …<br>${d2}의 배수: ${mult(d2)} …<br>처음 만나는 수 → <b>${L}</b><br>${F(n1, d1)} = ${F(n1 * L / d1, L)}, ${F(n2, d2)} = ${F(n2 * L / d2, L)}` };
    },
    () => { // 분모가 다른 크기 비교
      const [d1, d2] = denPair(), n1 = coprimeNum(d1), n2 = coprimeNum(d2), L = lcm(d1, d2);
      const c = new Fr(n1, d1).cmp(new Fr(n2, d2));
      return { ask: '알맞은 기호를 고르세요.', q: `${F(n1, d1)} ${CH} ${F(n2, d2)}`, kind: 'choice', choices: ['>', '<', '='], ans: cmpSym(c),
        hint: '먼저 <b>통분</b>해서 분모를 같게 만든 다음, 분자를 비교해요.',
        ex: `통분하면 ${F(n1 * L / d1, L)} ${cmpSym(c)} ${F(n2 * L / d2, L)}<br>${stack([[F(n1, d1), bar(L, n1 * L / d1, { w: 260 })], [F(n2, d2), bar(L, n2 * L / d2, { w: 260, color: C.s2 })]])}` };
    },
  ],
},
/* ---------------- ③ 분수의 덧셈·뺄셈 ---------------- */
{
  title: '분수의 덧셈과 뺄셈', short: '분수 덧셈·뺄셈',
  cards: () => [
    { pic: eqrow([pie(4, 1, { size: 120 }), '+', pie(4, 2, { size: 120, color: C.s2 }), '=', pie(4, 3, { size: 120 })]), text: `조각 크기가 같으면 <b>조각 수만</b> 더해요. 분모는 그대로!<br>${F(1, 4)} + ${F(2, 4)} = ${F(3, 4)}` },
    { pic: stack([[F(1, 2), bar(2, 1)], [F(1, 3), bar(3, 1, { color: C.s2 })], [F(5, 6), bar(6, 5)]]), text: `조각 크기가 다르면 먼저 <b>통분</b>!<br>${F(1, 2)} + ${F(1, 3)} = ${F(3, 6)} + ${F(2, 6)} = ${F(5, 6)}` },

  ],
  types: [
    () => { // 그림 보고 분모 같은 덧셈
      const d = ri(3, 8), a = ri(1, d - 1), b = ri(1, d - a);
      const pic = stack([[F(a, d), bar(d, a, { w: 280 })], [F(b, d), bar(d, b, { w: 280, color: C.s2 })]]);
      return { ask: '그림을 보고 계산해 보세요.', pic, q: `${F(a, d)} + ${F(b, d)} = ${A}`, kind: 'frac', ans: new Fr(a + b, d),
        hint: '분모가 같으니까 색칠한 조각 수만 더해요. 분모는 그대로!',
        ex: `${bar(d, a + b, { w: 280 })}<br>${a} + ${b} = ${a + b}조각 → ${VR(a + b, d)}` };
    },
    () => { // 분모 같은 덧셈·뺄셈
      const d = ri(3, CONFIG.MAX_DEN), plus = Math.random() < .5;
      let a, b; if (plus) { a = ri(1, d - 1); b = ri(1, d - 1); } else { a = ri(2, d - 1); b = ri(1, a - 1); }
      const r = plus ? a + b : a - b, op = plus ? '+' : M;
      return { ask: '계산해 보세요.', q: `${F(a, d)} ${op} ${F(b, d)} = ${A}`, kind: 'frac', ans: new Fr(r, d),
        hint: `분모가 같으면 분자끼리만 ${plus ? '더해요' : '빼요'}. 답이 1보다 커도 괜찮아요(가분수).`,
        ex: `${F(`${a} ${op} ${b}`, d)} = ${VR(r, d)}` };
    },
    () => { // 분모 다른 덧셈
      const [d1, d2] = denPair(), n1 = coprimeNum(d1), n2 = coprimeNum(d2), L = lcm(d1, d2);
      const a = n1 * L / d1, b = n2 * L / d2;
      return { ask: '계산해 보세요.', q: `${F(n1, d1)} + ${F(n2, d2)} = ${A}`, kind: 'frac', ans: new Fr(a + b, L),
        hint: `분모가 달라요! 먼저 공통분모 <b>${L}</b>로 통분해요.`,
        ex: `${F(n1, d1)} + ${F(n2, d2)} = ${F(a, L)} + ${F(b, L)} = ${VR(a + b, L)}` };
    },
    () => { // 분모 다른 뺄셈
      let d1, d2, n1, n2; do { [d1, d2] = denPair(); n1 = coprimeNum(d1); n2 = coprimeNum(d2); } while (new Fr(n1, d1).cmp(new Fr(n2, d2)) <= 0);
      const L = lcm(d1, d2), a = n1 * L / d1, b = n2 * L / d2;
      return { ask: '계산해 보세요.', q: `${F(n1, d1)} ${M} ${F(n2, d2)} = ${A}`, kind: 'frac', ans: new Fr(a - b, L),
        hint: `먼저 공통분모 <b>${L}</b>로 통분한 다음 분자끼리 빼요.`,
        ex: `${F(n1, d1)} ${M} ${F(n2, d2)} = ${F(a, L)} ${M} ${F(b, L)} = ${VR(a - b, L)}` };
    },
  ],
},

/* =========================================================
   저장 (이 태블릿 안에만 남습니다)
   ========================================================= */
function emptyStore() { return { name: '', char: '', passed: {}, stars: {}, allOpen: false }; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && typeof s === 'object') return Object.assign(emptyStore(), s); } catch (e) {}
  return emptyStore();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
let store = load();
const today = () => { const t = new Date(); return `${t.getFullYear()}. ${t.getMonth() + 1}. ${t.getDate()}.`; };
const isPassed = u => !!store.passed[u];
const isOpen = u => u === 0 || store.allOpen || isPassed(u) || isPassed(u - 1);
const stageName = u => `STAGE ${u + 1} · ${UNITS[u].title}`;
const curChar = () => (CHARACTERS.find(c => c.id === store.char) || CHARACTERS[0]);
// 캐릭터 그림 HTML (그림 → 대신할 표정 → 기본 → 이모지 순서로 찾음)
function charHTML(pose = 'idle', id) {
  const c = id ? CHARACTERS.find(x => x.id === id) : curChar();
  const im = (window.CHAR_IMAGES || {})[c.id] || {};
  const src = im[pose] || im[POSE_FALLBACK[pose]] || im[POSE_FALLBACK[POSE_FALLBACK[pose]]] || im.idle;
  return src ? `<img class="ch" src="${src}" alt="${c.name}" draggable="false">` : `<div class="ph">${c.emoji}</div>`;
}
// 표정을 바꾸고 움직임을 다시 재생
function setPose(el, pose, id) {
  el.innerHTML = charHTML(pose, id);
  el.classList.remove('anim-idle', 'anim-happy', 'anim-jump', 'anim-cheer', 'anim-oops', 'anim-talk');
  void el.offsetWidth; el.classList.add('anim-' + pose);
}
const starsHTML = n => [0, 1, 2].map(i => `<span class="${i < n ? 'on' : ''}">★</span>`).join('');
const CIRCLED = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨'];

/* =========================================================
   화면 전환과 창
   ========================================================= */
const $ = id => document.getElementById(id);
function go(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function openModal(html, wide) { $('mbox').className = 'mbox' + (wide ? ' wide' : ''); $('mbox').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { if (b.dataset.go === 'map') renderMap(); go(b.dataset.go); });

/* =========================================================
   1. 징검다리 지도
   ========================================================= */
let justPassed = null; // 방금 합격한 단원 → 도장 + 깡충 효과
function renderMap() {
  $('nameText').textContent = store.name || '';
  $('chipChar').innerHTML = charHTML('idle');
  // 캐릭터는 아직 합격하지 않은 첫 번째 돌 위에 섬 (모두 합격하면 도착 깃발)
  let pos = UNITS.findIndex((_, k) => !isPassed(k)); if (pos < 0) pos = 9;
  const me = `<div class="mapchar" id="mapChar"><div class="inner">${charHTML('idle')}</div></div>`;
  const stone = k => {
    const u = UNITS[k], passed = isPassed(k), open = isOpen(k);
    const cls = passed ? 'passed' : open ? 'current' : 'locked';
    return `<button class="stone ${cls} ${justPassed === k ? 'stamp' : ''}" data-u="${k}">
      ${k === pos ? me : ''}
      <div class="rock">${k + 1}</div>
      ${passed ? '<div class="seal">합격</div>' : open ? '' : '<div class="badge">🔒</div>'}
      <div class="lbl">${u.short}</div>
      <div class="stars">${passed ? starsHTML(store.stars[k] || 0) : ''}</div></button>`;
  };
  const goal = `<div class="goal">${pos === 9 ? me : ''}<div class="flag">🚩</div><div class="lbl">도착!</div><div class="stars"></div></div>`;
  const lane = (title, from, to, tail = '') => `<div class="lane"><h3>${title}</h3><div class="stream">` +
    Array.from({ length: to - from }, (_, i) => stone(from + i)).join('') + tail + '</div></div>';
  $('river').innerHTML = lane('초등 분수', 0, 5) + lane('중1 정수와 유리수', 5, 9, goal);
  const starSum = Object.values(store.stars).reduce((a, b) => a + b, 0);
  $('mapFoot').innerHTML = `합격 도장 <b>${Object.keys(store.passed).length}</b> / 9 &nbsp;·&nbsp; 별 <b class="star">${starSum}</b> / 27`;
  const jp = justPassed; justPassed = null;
  if (jp != null) requestAnimationFrame(() => hopFrom(jp));
}
// 방금 합격한 돌에서 지금 자리까지 깡충 뛰어오기
function hopFrom(u) {
  const mc = $('mapChar'), from = $('river').querySelector(`.stone[data-u="${u}"]`);
  if (!mc || !from || mc.parentElement === from || !mc.animate) return;
  const a = from.getBoundingClientRect(), b = mc.parentElement.getBoundingClientRect();
  const dx = a.left - b.left, dy = a.top - b.top, inner = mc.firstElementChild;
  inner.innerHTML = charHTML('jump');
  const anim = mc.animate([
    { transform: `translate(${dx}px, ${dy}px)` },
    { transform: `translate(${dx / 2}px, ${Math.min(dy, 0) / 2 - 90}px)`, offset: .5 },
    { transform: 'translate(0, 0)' },
  ], { duration: 900, delay: 700, easing: 'ease-in-out', fill: 'backwards' });
  anim.onfinish = () => { inner.innerHTML = charHTML('happy'); setTimeout(() => { inner.innerHTML = charHTML('idle'); }, 1400); };
}
$('river').onclick = e => {
  const b = e.target.closest('.stone'); if (!b) return;
  const u = +b.dataset.u;
  if (!isOpen(u)) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }

};

/* =========================================================
   3. 문제 풀이
   ========================================================= */
let play = null;
// play = { mode, unit, p, inp, tries, retried, phase, streak, exam:[], idx, results:[] }

function newProblem(unit, type) {
  const types = UNITS[unit].types;
  const t = type == null ? ri(0, types.length - 1) : type;
  const p = types[t](); p.t = t; p.unit = unit; return p;
}
function makeExam(unit) {
  const n = UNITS[unit].types.length, list = [], seen = new Set();
  const order = Array.from({ length: CONFIG.EXAM_COUNT }, (_, i) => i % n).sort((a, b) => a - b); // 쉬운 유형부터
  for (const t of order) {
    let p, tries = 0;
    do { p = newProblem(unit, t); tries++; } while (seen.has(p.ask + p.q + p.ans) && tries < 15);
    seen.add(p.ask + p.q + p.ans); list.push(p);
  }
  return list;
}

function startPlay(mode) {
  play = { mode, unit: cur.unit, streak: 0, idx: 0, results: [] };
  $('playTitle').textContent = stageName(cur.unit);
  $('progress').classList.toggle('hidden', mode !== 'exam');
  $('hintBtn').classList.toggle('hidden', mode === 'exam');
  if (mode === 'exam') {
    play.exam = makeExam(cur.unit);
    $('progress').innerHTML = Array.from({ length: CONFIG.EXAM_COUNT }, () => '<i class="st"></i>').join('') + `<div class="mini" id="mini">${charHTML('idle')}</div>`;
    loadProblem(play.exam[0]);
  } else loadProblem(newProblem(cur.unit));
  go('play'); updateStatus();
}

function loadProblem(p) {
  play.p = p; play.tries = 0; play.retried = false; play.phase = 'answer';
  play.inp = { neg: false, num: '', den: '', focus: 'num', choice: null, set: new Set(), point: null };
  $('ask').innerHTML = p.ask || '';
  feedback(play.mode === 'exam' ? `${play.idx + 1}번째 문제! 차근차근 풀어 보자` : pick(['같이 풀어 보자!', '천천히 해도 괜찮아 😊', '할 수 있어! 💪', '이번 문제도 해 보자!']), '', 'idle');
  $('helpBox').classList.add('hidden'); $('helpBox').innerHTML = '';
  $('choices').innerHTML = p.kind === 'choice' ? p.choices.map(c => `<button data-c="${c}">${c}</button>`).join('') : '';
  const inputKind = p.kind === 'frac' || p.kind === 'int';
  $('pad').classList.toggle('dim', !inputKind);
  $('fracSel').classList.toggle('hidden', p.kind !== 'frac');
  setCheckBtn('확인 ✔', false);
  updateStatus();
  renderPic(); renderExpr();
  $('qarea').scrollTop = 0;
}

function updateStatus() {
  if (play.mode === 'exam') {
    $('playStatus').textContent = `📝 시험 ${play.idx + 1} / ${CONFIG.EXAM_COUNT}`;
    const sts = $('progress').querySelectorAll('.st'), m = $('mini');
    sts.forEach((el, i) => el.classList.toggle('done', i < play.idx));
    const t = sts[Math.min(play.idx, sts.length - 1)];
    if (t && m) m.style.left = (t.offsetLeft + t.offsetWidth / 2 - 29) + 'px';
  } else $('playStatus').textContent = `✏️ 연습 · 연속 정답 ${play.streak}${play.streak >= 3 ? '🔥' : ''}`;
}
function setCheckBtn(text, next) { $('checkBtn').textContent = text; $('checkBtn').classList.toggle('next', next); }

// 그림: 색칠하기·점 찍기 문제는 학생이 누른 대로 다시 그림
function renderPic() {
  const p = play.p;
  if (p.kind === 'shade') $('pic').innerHTML = p.shape === 'pie' ? pie(p.n, 0, { size: 220, click: true, set: play.inp.set }) : bar(p.n, 0, { w: 460, h: 80, click: true, set: play.inp.set });
  else if (p.kind === 'numline') $('pic').innerHTML = numLine(Object.assign({}, p.line, { click: true, sel: play.inp.point, w: 680 }));
  else $('pic').innerHTML = p.pic || '';
}

// 식과 답 칸
function ansBoxHTML() {
  const i = play.inp, p = play.p;
  const sign = `<span class="asign" id="aSign">${i.neg ? M : ''}</span>`;
  if (p.kind === 'frac') {
    return `<span class="ans">${sign}<span class="afrac">
      <span class="abox ${i.focus === 'num' ? 'on' : ''}" data-f="num">${i.num}</span><span class="aline"></span>
      <span class="abox ${i.focus === 'den' ? 'on' : ''}" data-f="den">${i.den}</span></span></span>`;
  }
  return `<span class="ans">${sign}<span class="abox on">${i.num}</span></span>`;
}
function renderExpr() {
  const p = play.p;
  let html = p.q || '';
  if (p.kind === 'frac' || p.kind === 'int') html = html.replace(A, ansBoxHTML());
  if (p.kind === 'choice') html = html.replace(CH, `<span class="cbox">${play.inp.choice || '?'}</span>`);
  $('expr').innerHTML = html;
  $('fracSel').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.f === play.inp.focus));
  $('choices').querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.c === play.inp.choice));
}

/* ---------- 입력 ---------- */
$('pad').onclick = e => {
  const b = e.target.closest('button'); if (!b || play.phase !== 'answer') return;
  const i = play.inp, k = b.dataset.k, f = play.p.kind === 'frac' ? i.focus : 'num';
  if (k === '-') i.neg = !i.neg;
  else if (k === 'del') { if (i[f]) i[f] = i[f].slice(0, -1); else if (f === 'den') i.focus = 'num'; }
  else if (i[f].length < 3) { i[f] = (i[f] === '0' ? '' : i[f]) + k; }
  renderExpr();
};
$('fracSel').onclick = e => { const b = e.target.closest('button'); if (!b || play.phase !== 'answer') return; play.inp.focus = b.dataset.f; renderExpr(); };
$('expr').onclick = e => { const b = e.target.closest('[data-f]'); if (!b || play.phase !== 'answer') return; play.inp.focus = b.dataset.f; renderExpr(); };
$('choices').onclick = e => { const b = e.target.closest('button'); if (!b || play.phase !== 'answer') return; play.inp.choice = b.dataset.c; renderExpr(); };
$('pic').onclick = e => {
  if (play.phase !== 'answer') return;
  const piece = e.target.closest('[data-i]'), tick = e.target.closest('[data-v]');
  if (piece && play.p.kind === 'shade') { const n = +piece.dataset.i; play.inp.set.has(n) ? play.inp.set.delete(n) : play.inp.set.add(n); renderPic(); }
  if (tick && play.p.kind === 'numline') { play.inp.point = +tick.dataset.v; renderPic(); }
};
$('hintBtn').onclick = () => { if (play.mode === 'practice' && play.phase === 'answer') { feedback('힌트를 보여 줄게!', 'info', 'talk'); showHelp('💡 힌트', play.p.hint); } };
function showHelp(title, html) { $('helpBox').innerHTML = `<h4>${title}</h4>${html}`; $('helpBox').classList.remove('hidden'); setTimeout(() => $('helpBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 30); }
function shakeExpr() { const el = $('expr'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ---------- 채점 ----------
   반환: 'empty'(아직 안 씀) | 'zero'(분모 0) | 'reduce'(값은 맞는데 약분 덜 됨) | 'right' | 'wrong' */
function judge() {
  const p = play.p, i = play.inp;
  if (p.kind === 'choice') return i.choice == null ? 'empty' : (i.choice === p.ans ? 'right' : 'wrong');
  if (p.kind === 'shade') return i.set.size === 0 ? 'empty' : (i.set.size === p.ans ? 'right' : 'wrong');
  if (p.kind === 'numline') return i.point == null ? 'empty' : (i.point === p.ans ? 'right' : 'wrong');
  if (i.num === '') return 'empty';
  const num = +i.num * (i.neg ? -1 : 1);
  if (p.kind === 'int') return num === p.ans ? 'right' : 'wrong';
  if (i.den === '') return new Fr(num, 1).eq(p.ans) ? 'right' : 'wrong';         // 분모 칸 비움 = 정수
  if (+i.den === 0) return 'zero';
  const val = new Fr(num, +i.den);
  if (!val.eq(p.ans)) return 'wrong';
  if (p.ans.red().d === 1) return 'right';   // 정답이 정수면 3/3, 1/1처럼 값이 같은 분수도 모두 정답
  const notReduced = gcd(+i.num, +i.den) > 1 || +i.den === 1;
  if (notReduced && !p.noRed && CONFIG.REDUCE_RETRY) return play.retried ? 'wrong' : 'reduce';
  return 'right';
}
// 학생이 쓴 답(복습 화면용)
function userAnsHTML() {
  const p = play.p, i = play.inp;
  if (p.kind === 'choice') return i.choice;
  if (p.kind === 'shade') return `${i.set.size}조각 색칠`;
  if (p.kind === 'numline') return N(i.point);
  const sign = i.neg ? M : '';
  return sign + (p.kind === 'frac' && i.den !== '' ? F(i.num, i.den) : i.num);
}
function correctAnsHTML(p) {
  if (p.kind === 'frac') return V(p.noRed ? p.ans : p.ans.red());
  if (p.kind === 'int' || p.kind === 'numline') return N(p.ans);
  if (p.kind === 'shade') return `${p.ans}조각 색칠`;
  return p.ans;
}
// 정답을 채운 식(그림 풀이·복습용)
function solvedExpr(p) {
  if (!p.q) return '';
  return p.q.replace(A, `<span class="filled">${correctAnsHTML(p)}</span>`).replace(CH, `<span class="cbox filled">${p.ans}</span>`);
}

$('checkBtn').onclick = () => {
  if (play.phase === 'wait') return;
  if (play.phase === 'next') { loadProblem(newProblem(play.unit)); return; }
  if (play.phase === 'similar') { loadProblem(newProblem(play.unit, play.p.t)); return; }
  const r = judge();
  if (r === 'empty') { shakeExpr(); if (play.p.kind === 'shade' || play.p.kind === 'numline') { const el = $('pic'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } return; }
  if (r === 'zero') { feedback('분모는 0이 될 수 없어요!', 'bad', 'oops'); shakeExpr(); return; }
  if (r === 'reduce') { play.retried = true; feedback(CONFIG.REDUCE_MSG, 'info', 'talk'); return; }
  play.mode === 'exam' ? examStep(r === 'right') : practiceStep(r === 'right');
};
// 친구 캐릭터가 표정을 바꾸며 말풍선으로 말함
function feedback(text, cls, pose = 'idle') { setPose($('buddy'), pose); const b = $('bubble'); b.innerHTML = text; b.className = 'bubble ' + cls; }

/* ---------- 연습 ---------- */
function practiceStep(ok) {
  if (ok) {
    play.streak++; updateStatus();
    feedback(pick(CONFIG.CHEERS), 'ok', 'happy');
    play.phase = 'next'; setCheckBtn('다음 문제 →', true);
    return;
  }
  play.tries++;
  if (play.tries === 1) {           // 첫 번째 오답: 힌트 보여주고 다시
    feedback(CONFIG.RETRY_MSG, 'bad', 'oops'); showHelp('💡 힌트', play.p.hint); return;
  }
  // 두 번째 오답: 그림 풀이 + 정답, 그리고 숫자만 바꾼 비슷한 문제
  play.streak = 0; updateStatus();
  feedback('괜찮아요! 풀이를 같이 봐요 🙂', 'info', 'talk');
  showHelp('🖍 그림 풀이', `<div class="expr" style="font-size:34px">${solvedExpr(play.p)}</div>${play.p.ex}`);
  if (play.p.kind === 'shade' || play.p.kind === 'numline') $('pic').innerHTML = '';
  play.phase = 'similar'; setCheckBtn('비슷한 문제 →', true);
}

/* ---------- 시험 ---------- */
function examStep(ok) {
  play.results.push({ p: play.p, ok, user: userAnsHTML() });
  play.idx++;
  if (play.idx >= CONFIG.EXAM_COUNT) return finishExam();
  play.phase = 'wait';
  feedback('좋아, 다음 문제!', 'info', 'jump');
  setTimeout(() => loadProblem(play.exam[play.idx]), 350); // 맞았는지는 끝나고 한꺼번에 공개
}

/* =========================================================
   4. 결과 / 합격증
   ========================================================= */
function certHTML(u, date) {
  return `<div class="cert"><div class="cchar">${charHTML('happy')}</div><div class="cseal">합격<br>🐾</div><div class="ct">합격증</div>
    <div class="cn">${escapeHTML(store.name)}</div><div class="cu">${CIRCLED[u]} ${UNITS[u].title}</div><div class="cd">${date || ''}</div></div>`;
}
function finishExam() {
  const u = play.unit, score = play.results.filter(r => r.ok).length, pass = score >= CONFIG.PASS_SCORE;
  const stars = score >= CONFIG.STAR_3 ? 3 : score >= CONFIG.STAR_2 ? 2 : pass ? 1 : 0;
  const wasPassed = isPassed(u), before = store.stars[u] || 0;
  if (pass && !wasPassed) { store.passed[u] = today(); justPassed = u; }
  if (stars > before) store.stars[u] = stars;
  save();
  const allDone = Object.keys(store.passed).length >= UNITS.length;
  setPose($('resBuddy'), pass ? (allDone && !wasPassed ? 'cheer' : 'happy') : 'oops');
  $('resTitle').textContent = pass ? `🎉 합격! ${score} / ${CONFIG.EXAM_COUNT}` : `${score} / ${CONFIG.EXAM_COUNT}`;
  $('resStars').innerHTML = pass ? [0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}" style="animation-delay:${.35 + i * .3}s">★</span>`).join('') : '';
  $('resStars').classList.toggle('hidden', !pass);
  $('resCert').innerHTML = pass ? certHTML(u, store.passed[u]) : '';
  let msg;
  if (!pass) msg = CONFIG.FAIL_MSG(CONFIG.PASS_SCORE, score);
  else if (!wasPassed) msg = u < UNITS.length - 1 ? '다음 돌이 열렸어요! 선생님께 합격증을 보여 드리세요.' : '징검다리를 모두 건넜어요! 정말 대단해요 🏆';
  else msg = stars > before ? '⭐ 별 기록을 새로 세웠어요!' : '이미 건넌 돌이에요. 별을 더 모아 볼까요?';
  if (pass && stars < 3) msg += `<br><small>${stars < 2 ? `${CONFIG.STAR_2}개 이상이면 ★★, ` : ''}${CONFIG.STAR_3}개를 다 맞히면 ★★★</small>`;
  $('resMsg').innerHTML = msg;
  const wrong = play.results.some(r => !r.ok);
  $('resBtns').innerHTML = (wrong ? `<button class="bigbtn" id="reviewBtn">🔍 틀린 문제 보기</button>` : '') +
    (pass ? `<button class="bigbtn green" id="toMapBtn">${!wasPassed && u < 8 ? '다음 돌로 →' : '지도로 →'}</button>`
          : `<button class="bigbtn" id="rePractice">✏️ 다시 연습하기</button><button class="bigbtn primary" id="reExam">📝 다시 시험</button>`);
  if (wrong) $('reviewBtn').onclick = showReview;
  if (pass) $('toMapBtn').onclick = () => { renderMap(); go('map'); };
  else { $('rePractice').onclick = () => startPlay('practice'); $('reExam').onclick = () => startPlay('exam'); }
  go('result');
}
function showReview() {
  const items = play.results.filter(r => !r.ok).map(r => `<div class="rev">
      <div class="ask">${r.p.ask || ''}</div>
      ${r.p.q ? `<div class="rq">${solvedExpr(r.p)}</div>` : ''}
      <div class="ra">내 답: <b>${r.user}</b> · 정답: <span class="filled">${correctAnsHTML(r.p)}</span></div>
      <div class="rx">${r.p.ex}</div></div>`).join('');
  openModal(`<h2>🔍 틀린 문제 다시 보기</h2>${items}<div class="mrow"><button class="mbtn primary" onclick="closeModal()">닫기</button></div>`, true);
}

$('teacherBtn').onclick = () => {
  openModal(`<h2>⚙️ 교사용 메뉴</h2><p>비밀번호를 입력하세요.</p>
    <input type="password" id="pwInput" inputmode="numeric" placeholder="비밀번호">
    <div class="mrow"><button class="mbtn" onclick="closeModal()">닫기</button><button class="mbtn primary" id="pwOk">확인</button></div>`);
  const inp = $('pwInput'); setTimeout(() => inp.focus(), 50);
  const ok = () => { if (inp.value === CONFIG.TEACHER_PW) teacherPanel(); else { inp.value = ''; inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); } };
  $('pwOk').onclick = ok; inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
};
function teacherPanel() {
  openModal(`<h2>⚙️ 교사용 메뉴</h2>
    <div class="sect">합격 단원 (체크하면 오늘 날짜·별 1개로 합격 처리 — 기록 복구용)</div>
    <div class="tgrid">${UNITS.map((u, k) => `<label><input type="checkbox" data-pu="${k}" ${isPassed(k) ? 'checked' : ''}>${CIRCLED[k]} ${u.short}</label>`).join('')}</div>
    <label class="tline"><input type="checkbox" id="allOpen" ${store.allOpen ? 'checked' : ''}>모든 돌 열어 두기 (합격하지 않아도 모든 단원 선택 가능)</label>
    <div class="mrow">
      <button class="mbtn" id="tName">이름 바꾸기</button>
      <button class="mbtn danger" id="tReset">기록 전부 지우기</button>
      <button class="mbtn primary" id="tClose">닫기</button>
    </div>`, true);
  $('mbox').querySelectorAll('[data-pu]').forEach(cb => cb.onchange = () => {
    const k = +cb.dataset.pu;
    if (cb.checked) { store.passed[k] = store.passed[k] || today(); store.stars[k] = store.stars[k] || 1; } else { delete store.passed[k]; delete store.stars[k]; }
    save(); renderMap();
  });
  $('allOpen').onchange = e => { store.allOpen = e.target.checked; save(); renderMap(); };
  $('tName').onclick = () => askName(false);
  $('tReset').onclick = () => {
    openModal(`<h2>기록을 모두 지울까요?</h2><p>이름, 캐릭터, 합격 기록과 별이 모두 사라지고 되돌릴 수 없어요.</p>
      <div class="mrow"><button class="mbtn" id="rNo">취소</button><button class="mbtn danger" id="rYes">모두 지우기</button></div>`);
    $('rNo').onclick = teacherPanel;
    $('rYes').onclick = () => { store = emptyStore(); save(); closeModal(); renderMap(); askName(true); };
  };
  $('tClose').onclick = () => { closeModal(); renderMap(); };
}

/* ---------- 시작 ---------- */
// 맨 아래 그림 데이터까지 모두 읽은 뒤 시작
window.addEventListener('DOMContentLoaded', () => {
  renderMap(); go('map');
  if (!store.name) askName(true); else if (!store.char) pickChar(true);
});
</script>

<script>
/* =========================================================
   캐릭터 그림 — 코드로 그린 4명 × 6표정.
   나중에 PNG 그림이 생기면 이 자리를 그림 데이터로 바꾸면 됩니다.
   ========================================================= */
window.CHAR_IMAGES = (() => {
  const INK = '#33303a';
  const SPEC = {
    rabbit: { fur: '#F4EDF2', light: '#FFFFFF', line: '#C8AEBC', inner: '#F8BCCF', belly: '#FFFFFF', acc: '#F7A04B', accLine: '#D6782A', nose: '#EE8FAE' },
    bear:   { fur: '#C8946A', light: '#DDB48E', line: '#8A5C3A', inner: '#F0C9A6', belly: '#F2DCC4', acc: '#86C9EE', accLine: '#4B9CC9', nose: '#5A3A28' },
    cat:    { fur: '#F5AE57', light: '#FCCD8C', line: '#C67C2B', inner: '#F8BCCB', belly: '#FDE6C4', acc: '#6BC48D', accLine: '#3E9A62', nose: '#EE8FAE', stripe: '#DE8628' },
    frog:   { fur: '#93D468', light: '#BDEB94', line: '#5C9C3D', inner: '#fff', belly: '#E3F6C6', acc: '#F0625A', accLine: '#C23E37' },
  };
  const el = (cx, cy, rx, ry, a = '') => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" ${a}/>`;
  const furA = c => `fill="url(#g)" stroke="${c.line}" stroke-width="3.2"`;
  const arm = (c, cx, cy, rot) => el(cx, cy, 11, 19, `transform="rotate(${rot} ${cx} ${cy})" ${furA(c)}`);

  function eyes(id, pose, c) {
    const frog = id === 'frog', pts = frog ? [[70, 56], [130, 56]] : [[80, 100], [120, 100]];
    let s = '';
    pts.forEach(([x, y], i) => {
      if (frog) s += `<circle cx="${x}" cy="${y}" r="15" fill="#fff" stroke="${c.line}" stroke-width="2.5"/>`;
      if (pose === 'happy' || pose === 'jump' || pose === 'cheer') {
        s += `<path d="M${x - 8} ${y + 3} Q${x} ${y - 8} ${x + 8} ${y + 3}" fill="none" stroke="${INK}" stroke-width="4.2" stroke-linecap="round"/>`;
      } else {
        const up = pose === 'oops' ? -3 : 0, lk = pose === 'oops' ? (i ? -2 : -2) : 0;
        s += el(x + lk, y + up, 6.8, 8.4, `fill="${INK}"`);
        s += `<circle cx="${x + lk + 2.4}" cy="${y + up - 3}" r="2.6" fill="#fff"/><circle cx="${x + lk - 2}" cy="${y + up + 3}" r="1.2" fill="#fff"/>`;
      }
      if (pose === 'oops') { // 걱정 눈썹
        const by = y - (frog ? 22 : 16);
        s += i ? `<path d="M${x - 8} ${by - 3} L${x + 8} ${by + 2}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`
               : `<path d="M${x - 8} ${by + 2} L${x + 8} ${by - 3}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
      }
    });
    return s;
  }
  function mouth(id, pose) {
    const y = id === 'frog' ? 112 : 119;
    if (pose === 'happy' || pose === 'jump' || pose === 'cheer')
      return `<path d="M88 ${y - 3} Q100 ${y + 15} 112 ${y - 3} Z" fill="#8a3443" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>` + el(100, y + 6, 6, 3.6, 'fill="#F48FA6"');
    if (pose === 'talk') return el(100, y + 2, 7, 8, `fill="#8a3443" stroke="${INK}" stroke-width="2.4"`) + el(100, y + 6, 4.5, 3, 'fill="#F48FA6"');
    if (pose === 'oops') return `<path d="M91 ${y + 3} Q95.5 ${y - 2} 100 ${y + 3} Q104.5 ${y + 8} 109 ${y + 3}" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
    return `<path d="M92 ${y - 2} Q96 ${y + 4} 100 ${y} Q104 ${y + 4} 108 ${y - 2}" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
  }
  function draw(id, pose) {
    const c = SPEC[id], frog = id === 'frog';
    let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 200 212"><defs><radialGradient id="g" cx="40%" cy="32%" r="75%"><stop offset="0" stop-color="${c.light}"/><stop offset="1" stop-color="${c.fur}"/></radialGradient></defs>`;
    if (pose === 'jump') s += `<g stroke="#b9c7d2" stroke-width="3" stroke-linecap="round" fill="none"><path d="M70 196 q6 -5 12 0"/><path d="M94 198 q6 -5 12 0"/><path d="M118 196 q6 -5 12 0"/></g><g transform="translate(0 -12)">`;
    else s += '<g>';
    // 깃발 (축하)
    if (pose === 'cheer') s += `<line x1="158" y1="104" x2="164" y2="20" stroke="#8a6a4a" stroke-width="4" stroke-linecap="round"/><path d="M164 20 L196 32 L163 44 Z" fill="#F0625A" stroke="#C23E37" stroke-width="2.5" stroke-linejoin="round"/>`;
    // 발과 몸
    s += el(80, 182, 16, 9, furA(c)) + el(120, 182, 16, 9, furA(c));
    s += el(100, 154, 39, 31, furA(c)) + el(100, 160, 22, 17, `fill="${c.belly}"`);
    // 아래로 내린 팔은 몸 뒤쪽 느낌으로 먼저
    const raised = pose === 'happy' || pose === 'jump' || pose === 'cheer';
    if (!raised) s += arm(c, 62, 150, 25);
    if (!raised && pose === 'idle') s += arm(c, 138, 150, -25);
    if (pose === 'oops' || pose === 'talk') { /* 오른팔은 머리 다음에 */ }
    // 귀 (머리 뒤)
    if (id === 'rabbit') {
      s += el(80, 40, 13, 33, `transform="rotate(-10 80 70)" ${furA(c)}`) + el(80, 42, 6.5, 23, `transform="rotate(-10 80 70)" fill="${c.inner}"`);
      s += el(120, 40, 13, 33, `transform="rotate(10 120 70)" ${furA(c)}`) + el(120, 42, 6.5, 23, `transform="rotate(10 120 70)" fill="${c.inner}"`);
    }
    if (id === 'bear') {
      s += `<circle cx="56" cy="58" r="19" ${furA(c)}/><circle cx="56" cy="58" r="10" fill="${c.inner}"/>`;
      s += `<circle cx="144" cy="58" r="19" ${furA(c)}/><circle cx="144" cy="58" r="10" fill="${c.inner}"/>`;
    }
    if (id === 'cat') {
      s += `<path d="M48 82 Q44 34 58 32 Q76 42 90 54 Z" ${furA(c)} stroke-linejoin="round"/><path d="M56 70 Q55 46 61 44 Q71 50 79 57 Z" fill="${c.inner}"/>`;
      s += `<path d="M152 82 Q156 34 142 32 Q124 42 110 54 Z" ${furA(c)} stroke-linejoin="round"/><path d="M144 70 Q145 46 139 44 Q129 50 121 57 Z" fill="${c.inner}"/>`;
    }
    if (frog) s += `<circle cx="70" cy="58" r="23" ${furA(c)}/><circle cx="130" cy="58" r="23" ${furA(c)}/>`;
    // 머리
    s += frog ? el(100, 102, 64, 46, furA(c)) : el(100, 98, 60, 52, furA(c));
    if (frog) s += `<circle cx="70" cy="58" r="21" fill="url(#g)"/><circle cx="130" cy="58" r="21" fill="url(#g)"/>`; // 머리 선 가리기
    if (id === 'cat') s += `<g stroke="${c.stripe}" stroke-width="3.4" stroke-linecap="round"><path d="M91 54 l3 10"/><path d="M100 50 v12"/><path d="M109 54 l-3 10"/></g>`;
    if (id === 'bear') s += el(100, 116, 24, 17, `fill="${c.belly}"`) + el(100, 108, 7.5, 5.5, `fill="${c.nose}"`);
    if (id === 'rabbit' || id === 'cat') s += `<path d="M96 109 Q100 106 104 109 Q102 113 100 113 Q98 113 96 109 Z" fill="${c.nose}"/>`;
    if (id === 'cat') s += `<g stroke="${c.line}" stroke-width="2" stroke-linecap="round" opacity=".7"><path d="M56 110 l-16 -3"/><path d="M56 116 l-16 3"/><path d="M144 110 l16 -3"/><path d="M144 116 l16 3"/></g>`;
    // 볼터치
    const by = frog ? 110 : 114;
    s += el(66, by, 10, 6, 'fill="#FF8FA8" opacity=".45"') + el(134, by, 10, 6, 'fill="#FF8FA8" opacity=".45"');
    s += eyes(id, pose, c) + mouth(id, pose);
    // 목도리·리본
    if (id === 'rabbit' || id === 'bear') {
      s += `<path d="M118 138 l8 24 l11 -4 l-7 -22 Z" fill="${c.acc}" stroke="${c.accLine}" stroke-width="2.5" stroke-linejoin="round"/>`;
      s += `<path d="M66 130 Q100 146 134 130 L136 140 Q100 158 64 140 Z" fill="${c.acc}" stroke="${c.accLine}" stroke-width="2.5" stroke-linejoin="round"/>`;
    } else {
      s += `<path d="M100 138 L82 127 L82 149 Z M100 138 L118 127 L118 149 Z" fill="${c.acc}" stroke="${c.accLine}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="100" cy="138" r="5" fill="${c.acc}" stroke="${c.accLine}" stroke-width="2.5"/>`;
    }
    // 앞으로 나온 팔
    if (raised) s += arm(c, 52, 118, -35) + arm(c, 148, 118, 35);
    if (pose === 'oops') s += arm(c, 152, 100, -25) + `<path d="M162 70 q6 9 0 13 q-6 -4 0 -13 Z" fill="#8cc8f0"/>`;
    if (pose === 'talk') s += arm(c, 150, 124, 40) + `<circle cx="163" cy="106" r="5.5" ${furA(c)}/>`;
    s += '</g></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  }
  const out = {};
  Object.keys(SPEC).forEach(id => { out[id] = {}; ['idle', 'happy', 'oops', 'jump', 'talk', 'cheer'].forEach(p => out[id][p] = draw(id, p)); });
  return out;
})();
</script>
